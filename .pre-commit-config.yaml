# Hooks run automatically on `git commit`. Run on everything with:
#   uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(ps1|bat|cmd)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Secret scanning: blocks commits that contain API keys, tokens, passwords.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Uses the project's own mypy (from uv.lock) so results match CI exactly.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend
        name: frontend (types, lint, format)
        entry: bash -c 'cd frontend && npm run --silent typecheck && npm run --silent lint && npm run --silent format:check'
        language: system
        files: ^frontend/
        pass_filenames: false

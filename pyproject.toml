# Workspace root. This file is not itself a package: it ties the Python
# packages in this repo together (one lockfile, one .venv) and holds the
# shared developer tooling and its configuration.

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
sia-backend = { workspace = true }

[dependency-groups]
dev = [
    "sia-backend",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.11",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28.1",
]

# ---------------------------------------------------------------
# Ruff: linter + formatter for all Python code in the repo
# ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
# Where first-party code lives, so imports are grouped correctly.
src = ["backend/src", "backend"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "S",        # bandit: security checks
    "C4",       # comprehensions
    "SIM",      # simplifications
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",        # `assert` is how pytest works
    "S105", "S106", # tests use obviously fake credentials
]

# ---------------------------------------------------------------
# Mypy: strict static type checking
# ---------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["backend/src", "backend/tests"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Warnings fail the test run, so deprecations are fixed when they appear, not years later.
filterwarnings = ["error"]
markers = [
    "integration: needs a running PostgreSQL (docker compose up -d db). Skip with -m 'not integration'.",
]

# Alembic (database migrations) configuration.
# Run from the repository root, e.g.:
#   uv run alembic -c backend/alembic.ini upgrade head
#
# The database URL is NOT stored here: env.py reads it from application Settings
# (environment variables / .env), so credentials never live in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Files sort chronologically: 20261104_1200_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Newly generated migrations are formatted and linted like the rest of the code.
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Local development infrastructure.
#   Start:   docker compose up -d db
#   Stop:    docker compose stop
#   Reset:   docker compose down -v   (DELETES all local database data)
#
# Values come from the git-ignored `.env` file (see `.env.example`).

name: sia

services:
  db:
    # pgvector's image = official PostgreSQL 17 + the pgvector extension.
    # Pinned to an exact version so every machine runs the same database.
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sia_dev}
    ports:
      # Bound to 127.0.0.1 so the database is reachable only from this machine,
      # not from other devices on your network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

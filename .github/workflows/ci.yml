name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      # Throwaway database for integration tests — same image as compose.yaml.
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: sia
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: sia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sia -d sia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: sia
      POSTGRES_PASSWORD: ci-throwaway-password
      SIA_APP_DB_PASSWORD: ci-throwaway-app-password
      SIA_LOG_FORMAT: json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Create restricted app database role
        # Same script Docker Compose runs locally; psql connects via the PG* variables.
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci-throwaway-password
        run: bash infra/postgres/init/02-create-app-role.sh

      - name: Tests
        run: uv run pytest

      - name: Audit dependencies for known vulnerabilities
        # Every locked package (runtime and dev), checked at its exact locked version and hash.
        run: |
          uv export --frozen --format requirements-txt --all-packages --no-emit-workspace \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx --from "pip-audit==2.10.1" pip-audit -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --progress-spinner off

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv (to export the backend's API contract)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: API contract is up to date
        # Fails if the backend's API changed but the frontend's copy/types were not regenerated.
        run: |
          npm run api:sync
          git diff --exit-code -- src/lib/api/

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: End-to-end (browser + API + database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: sia
          POSTGRES_PASSWORD: ci-throwaway-password
          POSTGRES_DB: sia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sia -d sia_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: "true"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sia_e2e
      POSTGRES_USER: sia
      POSTGRES_PASSWORD: ci-throwaway-password
      SIA_APP_DB_PASSWORD: ci-throwaway-app-password
      SIA_LOG_FORMAT: json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Prepare database (app role + migrations)
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci-throwaway-password
        run: |
          bash infra/postgres/init/02-create-app-role.sh
          uv sync --locked
          uv run alembic -c backend/alembic.ini upgrade head

      - name: Build web app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Keep the report and traces of failed runs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  images:
    name: Production images (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build backend and web images
        run: |
          docker build -f deploy/backend.Dockerfile -t sia-backend:ci .
          docker build -f deploy/web.Dockerfile -t sia-web:ci .

      - name: Backend image runs as non-root and its code imports
        run: |
          test "$(docker run --rm sia-backend:ci id -u)" = "10001"
          docker run --rm -e POSTGRES_USER=x -e POSTGRES_PASSWORD=p -e SIA_APP_DB_PASSWORD=a \
            -e SIA_ENV=development sia-backend:ci \
            python -c "import sia.main, sia.worker.tasks; print('imports ok')"

      - name: Caddy configuration is valid
        run: docker run --rm sia-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Lint shell scripts and workflows
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            deploy/*.sh infra/postgres/init/02-create-app-role.sh
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color=false

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.0"  # keep in sync with .pre-commit-config.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history: scan every commit, not just the latest

      # Run the gitleaks CLI directly (the gitleaks-action wrapper fails on a repo's first push).
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "${tarball}" gitleaks

      - name: Scan full git history
        run: ./gitleaks git --redact --verbose .

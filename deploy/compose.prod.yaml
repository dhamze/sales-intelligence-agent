# Production stack: Caddy (HTTPS + static frontend) -> API -> PostgreSQL, plus the worker.
#
#   docker compose -f deploy/compose.prod.yaml up -d --build      (build on this machine)
#
# Settings and secrets come from deploy/.env.production (git-ignored; see
# deploy/env.production.example). Only Caddy publishes ports; the API and the database are
# reachable only inside the stack's private network.

name: sia-prod

x-backend: &backend
  image: ${SIA_BACKEND_IMAGE:-sia-backend:local}
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  env_file: .env.production
  environment:
    POSTGRES_HOST: db
    SIA_ENV: production
  restart: unless-stopped
  # Defence in depth: no writes to the image, no privilege escalation, no Linux capabilities.
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only the role script: the test database is a development-only thing.
      - ../infra/postgres/init/02-create-app-role.sh:/docker-entrypoint-initdb.d/02-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  # Runs to completion before every (re)start of the API: applies pending migrations as the
  # schema owner. The API itself only ever connects as the restricted sia_app role.
  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    <<: *backend
    command: ["python", "-m", "sia.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: ${SIA_WEB_IMAGE:-sia-web:local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"  # HTTP/3
    volumes:
      - caddy_data:/data  # certificates: keep, or Let's Encrypt rate limits may bite
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
